# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-ldap-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The AD/LDAP auth module as a droppable busbar plugin — a cdylib exporting the auth kind's door. Drop it in the plugins folder and add `ldap` to auth.chain / auth.methods with auth.methods.ldap settings (url, bind_dn_template, base_dn, group_attr)."

[lib]
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`. rlib: what `cargo test` links, and
# what makes the conformance test's cdylib get built.
crate-type = ["cdylib", "rlib"]

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-auth-ldap-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []

[dependencies]
# The one busbar crate (#40): busbar-contract, whose `abi::sdk` carries the export macro — pinned by
# git rev to `.busbar-ref` field 1.
busbar-contract = { workspace = true }
busbar-auth-ldap = { path = "../auth-ldap" }

[dev-dependencies]
# The shared host-services test double (`busbar_contract::services::double`): the dev-only
# `services-double` feature, on this edge alone; a test's host overrides only what it serves.
busbar-contract = { workspace = true, features = ["services-double", "test-seal"] }
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-auth-ldap-plugin = { path = ".", features = ["dropped-in"] }
# Dev-only, same pinned busbar rev as busbar-contract (one busbar source resolves): the linked +
# dropped-in conformance test (tests/conformance.rs) admits the linked door and the built cdylib
# through the REAL loader and drives both through its dispatcher; and the live plugin-side e2e
# (tests/e2e.rs) uses it to locate the built cdylib (plugin-loader's filename helper), pack it with
# the real busbar-plugin-pack BINARY (spawned), drive real blocking HTTP against a spawned real busbar
# binary + an OpenLDAP service container, and SEED that directory over plaintext LDAP (ldap3, a
# dev-only client: `sync` and no TLS feature, so no rustls 0.21 / ring 0.16 enters the lock; the
# plugin itself speaks its own sans-IO codec).
busbar-plugin-loader = { workspace = true }
busbar-test-kit = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "blocking"] }
ldap3 = { workspace = true }
serde_json = { workspace = true }
# THE SUITE'S HOST CONNECTION TABLE (tests/support/conformance_host.rs): busbar's test kit's stream
# table, upgraded with the connector's client TLS (rustls, the connector's own) and its TLS test
# kit. No transport plugin's crate: a plugin depends on no other plugin's code. Dev-only.
busbar-core-connector = { workspace = true }
rustls = { workspace = true }
