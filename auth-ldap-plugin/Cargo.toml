# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-ldap-plugin"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The AD/LDAP auth module as a droppable busbar plugin — a cdylib exporting the auth kind's door. Drop it in the plugins folder and add `ldap` to auth.chain / auth.methods with auth.methods.ldap settings (url, bind_dn_template, base_dn, group_attr)."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door, exporting `busbar_plugin_door`. rlib: what `cargo test` links, and
# what makes the conformance test's cdylib get built.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The one busbar crate (#40): busbar-contract, whose `abi::sdk` carries the export macro — pinned by
# git rev to `.busbar-ref` field 1.
busbar-contract = { workspace = true }
busbar-auth-ldap = { path = "../auth-ldap" }

[dev-dependencies]
# Dev-only, same pinned busbar rev as busbar-contract (one busbar source resolves): the linked +
# dropped-in conformance test (tests/conformance.rs) admits the linked door and the built cdylib
# through the REAL loader and drives both through its dispatcher; and the live plugin-side e2e
# (tests/e2e.rs) uses it to locate the built cdylib (plugin-loader's filename helper), pack it with
# the real busbar-plugin-pack BINARY (spawned), drive real blocking HTTP against a spawned real busbar
# binary + an OpenLDAP service container, and SEED that directory over plaintext LDAP (ldap3, a
# dev-only client: `sync` and no TLS feature, so no rustls 0.21 / ring 0.16 enters the lock; the
# plugin itself speaks its own sans-IO codec).
busbar-plugin-loader = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "blocking"] }
ldap3 = { workspace = true }
serde_json = { workspace = true }
