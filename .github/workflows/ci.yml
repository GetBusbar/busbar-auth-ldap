# RENDERED by `busbar-release plugin sync busbar-auth-ldap` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. THIS REPO TESTS ITSELF AGAINST BUSBAR with the fleet's ONE
# harness: busbar's reusable plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref), so
# the CI logic, the gates (busbar scripts/fleet/plugin-gates.py), the dependency policy
# (.github/fleet/deps.toml) and the contract move together (OWNER 2026-10-02). No CI logic lives here.
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}
  # release.yml runs this file on the tagged commit before it publishes.
  workflow_call: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@39374ec00e50dd06caad7af948b867703f0e2fe1
    with:
      service: openldap
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked --lib --test conformance -- --skip the_linked_and_the_dropped_in_door_are_one_plugin --skip red_a_moved_crossing_count_is_refused"
      extra_test: ""
      plugin_crate: busbar-auth-ldap-plugin
      plugin_kind: auth
      plugin_alias: ldap
    secrets: inherit
