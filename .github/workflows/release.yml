# RENDERED by `busbar-release plugin sync busbar-auth-ldap` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@39374ec00e50dd06caad7af948b867703f0e2fe1
    with:
      plugin_crate: busbar-auth-ldap-plugin
      manifest_name: busbar-auth-ldap
      plugin_alias: ldap
      plugin_kind: auth
      asset_prefix: busbar-auth-ldap
      description: "The AD/LDAP auth module as a droppable busbar plugin: a cdylib exporting the auth C ABI. Drop it in the plugins folder, define it once under identity-providers.<name> (module: ldap, settings: url, bind_dn_template, base_dn, group_attr) and reference that name from auth.chain."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "auth-ldap/declares.json"
      former_names: "busbar-auth-ldap-plugin"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@39374ec00e50dd06caad7af948b867703f0e2fe1
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-auth-ldap
      plugin_name: busbar-auth-ldap
      plugin_alias: ldap
      plugin_kind: auth
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
