# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-ldap"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The AD/LDAP auth module for busbar: BIND a username/password against an LDAP/LDAPS directory and map the user's group memberships (memberOf DNs) to a Principal. Its door (door::door) is a plugin_door! over the auth kind's table (abi::auth v3). It speaks LDAP as a sans-IO codec over the host connector's stream; it opens no socket and does no TLS."

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only). Pinned by git rev to the busbar commit in
# `.busbar-ref`; a busbar build that links this crate `[patch]`es the busbar git source to its own
# tree, so ONE copy of the contract links.
busbar-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The bind passwords (the end user's and the service account's) and the encoded BIND request that
# carries one are held in buffers wiped on drop.
zeroize = { workspace = true }
# No LDAP client crate and no socket or TLS stack: the module speaks LDAP through its own sans-IO
# codec (src/ber.rs, src/filter.rs, src/codec.rs) over the host connector's stream (BUSBAR-1.6.0.md
# THE DESIGN §5; R5/Q82).

[dev-dependencies]
# The contract's in-memory log double (WarnCapture), the test-seal edge a plugin's own tests take.
busbar-contract = { workspace = true, features = ["test-seal"] }
serde_json = { workspace = true }
